<script>
(function () {
  'use strict';

  /* ============ util ============ */
  var BOOT = window.BOOT || { appName: 'Buku Piket Digital', schoolName: 'SMPN 2 Pasawahan' };
  var TOKEN_KEY = 'bp.token';
  var ROLE_KEY = 'bp.role';
  var $ = function (sel, root) { return (root || document).querySelector(sel); };
  var $$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  var app = document.getElementById('app');
  var dlg = document.getElementById('dlg');

  function esc(value) {
    return String(value === null || value === undefined ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var storage = (function () {
    var memory = {};
    function ok() {
      try { var k = '__t'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); return true; } catch (e) { return false; }
    }
    var native = ok();
    return {
      get: function (k) { try { return native ? window.localStorage.getItem(k) : (memory[k] || null); } catch (e) { return memory[k] || null; } },
      set: function (k, v) { try { if (native) window.localStorage.setItem(k, v); else memory[k] = v; } catch (e) { memory[k] = v; } },
      del: function (k) { try { if (native) window.localStorage.removeItem(k); } catch (e) { /* abaikan */ } delete memory[k]; }
    };
  })();

  var ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
    users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2c2.6.3 4.5 2.2 4.5 5.3"/>',
    database: '<ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/><path d="M4 11.5v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
    file: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
    clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
    logout: '<path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/>',
    key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
    eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeoff: '<path d="M3 3l18 18"/><path d="M6.4 6.4C3.8 8.2 2 12 2 12s3.6 7 10 7c1.6 0 3-.4 4.3-1M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    circle: '<circle cx="12" cy="12" r="8"/>',
    chart: '<path d="M4 20V4M4 20h16"/><path d="M8 16v-5M12 16V8M16 16v-8"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>'
  };
  function icon(name, cls) {
    return '<svg class="icon ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>';
  }
  var LOGO = '<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="3" width="30" height="34" rx="5" fill="#154477" stroke="#fff" stroke-width="2"/>' +
    '<path d="M12 17h16M12 23h16M12 29h9" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".85"/><path d="M26 3v15l3.5-3 3.5 3V3z" fill="#1f9d6b"/></svg>';

  function initials(nama) {
    var parts = String(nama || '').split(',')[0].trim().split(/\s+/).filter(Boolean);
    return ((parts[0] || '?').charAt(0) + (parts.length > 1 ? parts[1].charAt(0) : '')).toUpperCase();
  }
  function shortName(nama) { return String(nama || '').split(',')[0].trim(); }
  function greeting() {
    var h = new Date().getHours();
    return h < 11 ? 'Selamat pagi' : h < 15 ? 'Selamat siang' : h < 18 ? 'Selamat sore' : 'Selamat malam';
  }
  function longDate(iso) {
    try {
      return new Date(iso + 'T00:00:00Z').toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return iso; }
  }

  /* ============ state ============ */
  var state = {
    token: null, user: null, roles: [], role: null, navId: null, mustChange: false,
    settings: { namaSekolah: BOOT.schoolName }, today: null, users: null, usersLoading: false, bootAt: 0
  };

  var NAV = {
    admin: [
      { id: 'beranda', label: 'Beranda', icon: 'home' },
      { id: 'pengguna', label: 'Pengguna', icon: 'users' },
      { id: 'master', label: 'Data master', icon: 'database', soon: { stage: 'Tahap 2 · Data master', text: 'Kelola data guru, siswa, kelas, jam pelajaran, jadwal pelajaran, jadwal piket, tahun ajaran, dan hari libur, lengkap dengan impor dari file.' } },
      { id: 'laporan', label: 'Laporan', icon: 'file', soon: { stage: 'Tahap 5 · Laporan', text: 'Laporan harian, mingguan, dan bulanan dalam PDF dan Excel, lengkap dengan kop surat sekolah.' } }
    ],
    kepsek: [
      { id: 'beranda', label: 'Beranda', icon: 'home' },
      { id: 'kehadiran', label: 'Kehadiran', icon: 'chart', soon: { stage: 'Tahap 4 · Dashboard', text: 'Ringkasan kehadiran siswa dan guru hari ini, tren mingguan, dan kejadian terbaru.' } },
      { id: 'laporan', label: 'Laporan', icon: 'file', soon: { stage: 'Tahap 5 · Laporan', text: 'Unduh laporan resmi sekolah dalam PDF dan Excel.' } }
    ],
    guru_piket: [
      { id: 'absen', label: 'Absen kelas', icon: 'clipboard', soon: { stage: 'Tahap 3 · Absensi', text: 'Absensi siswa per kelas saat piket pagi. Semua siswa berstatus hadir secara bawaan, Anda hanya menandai yang tidak hadir.' } },
      { id: 'kejadian', label: 'Kejadian', icon: 'alert', soon: { stage: 'Tahap 4 · Kejadian', text: 'Catat kejadian penting di sekolah atau di kelas, lengkap dengan waktu dan pencatatnya.' } },
      { id: 'presensi', label: 'Presensi guru', icon: 'user', soon: { stage: 'Tahap 3 · Absensi', text: 'Pantau kehadiran guru hari ini dan tindak lanjuti kelas yang kosong.' } },
      { id: 'laporan', label: 'Laporan', icon: 'file', soon: { stage: 'Tahap 5 · Laporan', text: 'Laporan harian piket yang siap dicetak atau diunduh.' } }
    ],
    guru_mapel: [
      { id: 'jadwal', label: 'Jadwal saya', icon: 'calendar', soon: { stage: 'Tahap 3 · Absensi', text: 'Jadwal mengajar Anda hari ini, dengan tombol absensi untuk jam pelajaran yang sedang berlangsung.' } },
      { id: 'kejadian', label: 'Kejadian', icon: 'alert', soon: { stage: 'Tahap 4 · Kejadian', text: 'Catat kejadian di kelas yang Anda ajar agar wali kelas dapat menindaklanjuti.' } }
    ],
    wali_kelas: [
      { id: 'beranda', label: 'Beranda', icon: 'home' },
      { id: 'rekap', label: 'Rekap kelas', icon: 'chart', soon: { stage: 'Tahap 4 · Dashboard', text: 'Rekap kehadiran kelas Anda, siswa yang sering terlambat atau alpa, dan rekap per siswa.' } }
    ]
  };

  /* ============ server ============ */
  function call(action, payload) {
    return new Promise(function (resolve, reject) {
      var failNet = { code: 'NETWORK', message: 'Tidak dapat terhubung ke server. Periksa sinyal Anda lalu coba lagi.' };
      if (!window.google || !google.script || !google.script.run) { reject(failNet); return; }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) { resolve(res.data); return; }
          var err = (res && res.error) || { code: 'UNKNOWN', message: 'Respons server tidak valid.' };
          if (err.code === 'UNAUTHENTICATED' && action !== 'auth.login') {
            err.handled = true;
            expire(err.message);
          } else if (err.code === 'PASSWORD_CHANGE_REQUIRED') {
            err.handled = true;
            state.mustChange = true;
            route();
          }
          reject(err);
        })
        .withFailureHandler(function () { reject(failNet); })
        .api({ action: action, token: state.token, payload: payload || {} });
    });
  }

  function expire(message) {
    state.token = null; state.user = null; state.roles = []; state.users = null;
    storage.del(TOKEN_KEY);
    closeDialog();
    renderLogin(message || 'Sesi berakhir. Silakan masuk kembali.');
  }

  /* ============ UI umum ============ */
  function toast(message, kind) {
    var el = document.createElement('div');
    el.className = 'toast' + (kind === 'error' ? ' error' : '');
    el.textContent = message;
    $('#toasts').appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, kind === 'error' ? 6500 : 3500);
  }

  function setBusy(btn, busy, label) {
    if (!btn) return;
    if (busy) {
      btn.dataset.html = btn.innerHTML;
      btn.setAttribute('aria-busy', 'true');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span><span>' + esc(label || 'Memproses…') + '</span>';
    } else {
      btn.removeAttribute('aria-busy');
      btn.disabled = false;
      if (btn.dataset.html) btn.innerHTML = btn.dataset.html;
    }
  }

  function showError(box, message) {
    if (!box) return;
    box.innerHTML = icon('alert', 'sm') + '<span>' + esc(message) + '</span>';
    box.hidden = false;
  }

  function openDialog(opts) {
    dlg.innerHTML = '<div class="dlg-head"><h2 id="dlgTitle">' + esc(opts.title) + '</h2>' +
      (opts.sub ? '<p class="muted">' + esc(opts.sub) + '</p>' : '') + '</div>' +
      '<div class="dlg-body">' + opts.body + '</div>' + (opts.foot ? '<div class="dlg-foot">' + opts.foot + '</div>' : '');
    dlg.setAttribute('aria-labelledby', 'dlgTitle');
    dlg.dataset.dismissible = opts.dismissible === false ? '0' : '1';
    if (!dlg.open) dlg.showModal();
    if (opts.onMount) opts.onMount(dlg);
  }
  function closeDialog() {
    if (dlg.open) dlg.close();
    dlg.innerHTML = '';
  }
  dlg.addEventListener('cancel', function (e) { if (dlg.dataset.dismissible === '0') e.preventDefault(); });
  dlg.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) { closeDialog(); return; }
    if (e.target === dlg && dlg.dataset.dismissible !== '0') closeDialog();
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    (dlg.open ? dlg : document.body).appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.parentNode.removeChild(ta);
    return ok;
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function bindPasswordToggles(root) {
    $$('.pw-toggle', root).forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = btn.parentNode.querySelector('input');
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.setAttribute('aria-pressed', show ? 'true' : 'false');
        btn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
        btn.innerHTML = icon(show ? 'eyeoff' : 'eye');
      });
    });
  }
  function pwField(id, label, autocomplete) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label><div class="pw-wrap">' +
      '<input class="input" id="' + id + '" type="password" autocomplete="' + autocomplete + '" autocapitalize="none" spellcheck="false" required>' +
      '<button type="button" class="pw-toggle" aria-label="Tampilkan password" aria-pressed="false">' + icon('eye') + '</button></div></div>';
  }

  /* ============ layar masuk ============ */
  function renderLogin(notice) {
    state.screen = 'login';
    app.innerHTML =
      '<div class="login"><section class="login-art">' +
        '<div class="login-brand">' + LOGO + '<strong>' + esc(BOOT.appName) + '</strong></div>' +
        '<h1>' + esc(BOOT.schoolName) + '</h1>' +
        '<p>Catat kehadiran, jadwal piket, dan kejadian harian sekolah di satu tempat.</p></section>' +
      '<section class="login-panel"><form class="login-card" id="loginForm" novalidate>' +
        '<div><h2>Masuk</h2><p class="muted">Gunakan username dan password dari admin sekolah.</p></div>' +
        (notice ? '<div class="alert info" role="status">' + icon('shield', 'sm') + '<span>' + esc(notice) + '</span></div>' : '') +
        '<div class="field"><label for="lu">Username</label><input class="input" id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></div>' +
        pwField('lp', 'Password', 'current-password') +
        '<div class="alert error" id="loginErr" role="alert" hidden></div>' +
        '<button class="btn block" id="loginBtn" type="submit">Masuk</button>' +
      '</form></section></div>';
    bindPasswordToggles(app);
    var form = $('#loginForm');
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var u = $('#lu').value.trim();
      var p = $('#lp').value;
      var errBox = $('#loginErr');
      errBox.hidden = true;
      if (!u || !p) { showError(errBox, 'Isi username dan password.'); (u ? $('#lp') : $('#lu')).focus(); return; }
      var btn = $('#loginBtn');
      setBusy(btn, true, 'Memeriksa…');
      call('auth.login', { username: u, password: p }).then(function (d) {
        return afterAuth(d);
      }).catch(function (e) {
        if (e.handled) return;
        setBusy(btn, false);
        showError(errBox, e.message);
        $('#lp').value = '';
        $('#lp').focus();
      });
    });
    $('#lu').focus();
  }

  function afterAuth(d) {
    state.token = d.token;
    storage.set(TOKEN_KEY, d.token);
    applyBootstrap(d);
    route();
  }

  function applyBootstrap(d) {
    state.user = d.user;
    state.mustChange = !!d.mustChange;
    state.roles = d.roles || [];
    state.settings = d.settings || state.settings;
    state.today = d.today;
    state.bootAt = Date.now();
    var ids = state.roles.map(function (r) { return r.id; });
    var saved = storage.get(ROLE_KEY);
    var role = ids.indexOf(saved) >= 0 ? saved : d.defaultRole;
    if (!role || ids.indexOf(role) < 0) role = ids[0] || null;
    if (role !== state.role) { state.role = role; state.navId = null; }
    if (role && !navItem(role, state.navId)) state.navId = NAV[role][0].id;
  }

  function navItem(role, id) {
    var list = NAV[role] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function route() {
    closeDialog();
    if (!state.token || !state.user) { renderLogin(); return; }
    if (state.mustChange) { renderForcedChange(); return; }
    renderShell();
  }

  /* ============ ganti password ============ */
  function passwordFormHtml(forced) {
    return '<form class="form" id="pwForm" novalidate>' +
      pwField('pw0', forced ? 'Password awal dari admin' : 'Password saat ini', 'current-password') +
      pwField('pw1', 'Password baru', 'new-password') +
      pwField('pw2', 'Ulangi password baru', 'new-password') +
      '<ul class="checklist" id="pwRules" aria-label="Syarat password">' +
        '<li data-r="len">' + icon('check') + '<span>Minimal 8 karakter</span></li>' +
        '<li data-r="diff">' + icon('check') + '<span>Berbeda dari password ' + (forced ? 'awal' : 'saat ini') + ' dan username</span></li>' +
        '<li data-r="same">' + icon('check') + '<span>Kedua isian password baru sama</span></li></ul>' +
      '<div class="alert error" id="pwErr" role="alert" hidden></div>' +
      '<div class="dlg-foot" style="padding:0;justify-content:stretch">' +
        (forced ? '' : '<button class="btn secondary" type="button" data-close>Batal</button>') +
        '<button class="btn" id="pwBtn" type="submit">Simpan password baru</button></div></form>';
  }

  function bindPasswordForm(root) {
    bindPasswordToggles(root);
    var u = state.user.username;
    function problems() {
      var o = $('#pw0', root).value, n = $('#pw1', root).value, c = $('#pw2', root).value;
      return {
        len: n.length >= 8 && n.length <= 128 && n.trim() !== '',
        diff: n !== '' && n !== o && n.toLowerCase() !== u,
        same: n !== '' && n === c
      };
    }
    function paint() {
      var p = problems();
      $$('#pwRules li', root).forEach(function (li) {
        var ok = p[li.dataset.r];
        li.classList.toggle('ok', ok);
        li.querySelector('svg').innerHTML = ICONS[ok ? 'check' : 'circle'];
      });
    }
    ['pw0', 'pw1', 'pw2'].forEach(function (id) { $('#' + id, root).addEventListener('input', paint); });
    paint();
    $('#pwForm', root).addEventListener('submit', function (ev) {
      ev.preventDefault();
      var box = $('#pwErr', root);
      box.hidden = true;
      var o = $('#pw0', root).value, n = $('#pw1', root).value;
      var p = problems();
      if (!o) { showError(box, 'Isi password ' + (state.mustChange ? 'awal' : 'saat ini') + '.'); $('#pw0', root).focus(); return; }
      if (!p.len) { showError(box, 'Password baru minimal 8 karakter.'); $('#pw1', root).focus(); return; }
      if (!p.diff) { showError(box, 'Password baru harus berbeda dari password lama dan username.'); $('#pw1', root).focus(); return; }
      if (!p.same) { showError(box, 'Isian ulang password baru belum sama.'); $('#pw2', root).focus(); return; }
      var btn = $('#pwBtn', root);
      setBusy(btn, true, 'Menyimpan…');
      call('auth.changePassword', { oldPassword: o, newPassword: n }).then(function (d) {
        state.token = d.token;
        storage.set(TOKEN_KEY, d.token);
        applyBootstrap(d);
        route();
        toast('Password berhasil diganti.');
      }).catch(function (e) {
        if (e.handled) return;
        setBusy(btn, false);
        showError(box, e.message);
      });
    });
  }

  function renderForcedChange() {
    state.screen = 'force';
    app.innerHTML =
      '<div class="login"><section class="login-art">' +
        '<div class="login-brand">' + LOGO + '<strong>' + esc(BOOT.appName) + '</strong></div>' +
        '<h1>Satu langkah lagi</h1><p>Demi keamanan, ganti password awal dari admin dengan password pilihan Anda sebelum mulai memakai aplikasi.</p></section>' +
      '<section class="login-panel"><div class="login-card"><div><h2>Ganti password</h2>' +
        '<p class="muted">Masuk sebagai <strong>' + esc(state.user.nama) + '</strong></p></div>' + passwordFormHtml(true) +
        '<button class="btn ghost" type="button" id="forceLogout">Keluar</button></div></section></div>';
    bindPasswordForm(app);
    $('#forceLogout').addEventListener('click', logout);
    $('#pw0').focus();
  }

  function logout() {
    var t = state.token;
    call('auth.logout').catch(function () { /* sesi tetap dibersihkan di klien */ });
    state.token = t;
    expire('Anda telah keluar.');
  }

  /* ============ kerangka aplikasi ============ */
  function renderShell() {
    state.screen = 'shell';
    app.innerHTML =
      '<div class="app"><header class="topbar"><div class="brand">' + LOGO +
        '<div class="brand-text"><strong>Buku Piket</strong><span>' + esc(state.settings.namaSekolah || BOOT.schoolName) + '</span></div></div>' +
        '<div class="topbar-actions" id="topActions"></div></header>' +
      '<div class="body"><nav class="nav" id="nav" aria-label="Menu utama"></nav>' +
      '<main id="main" tabindex="-1"></main></div></div>';
    renderTop();
    renderNav();
    renderMain(false);
  }

  function renderTop() {
    var box = $('#topActions');
    var roleHtml = '';
    if (state.roles.length > 1) {
      roleHtml = '<label class="sr-only" for="roleSelect">Peran aktif</label><select class="role-select" id="roleSelect">' +
        state.roles.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === state.role ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') + '</select>';
    } else if (state.roles.length === 1) {
      roleHtml = '<span class="role-chip">' + esc(state.roles[0].label) + '</span>';
    }
    box.innerHTML = roleHtml + '<button class="avatar" id="accountBtn" aria-label="Akun saya: ' + esc(state.user.nama) + '">' + esc(initials(state.user.nama)) + '</button>';
    var sel = $('#roleSelect');
    if (sel) sel.addEventListener('change', function () { setRole(sel.value); });
    $('#accountBtn').addEventListener('click', openAccount);
  }

  function setRole(id) {
    state.role = id;
    storage.set(ROLE_KEY, id);
    state.navId = NAV[id][0].id;
    renderNav();
    renderMain(true);
  }

  function renderNav() {
    var nav = $('#nav');
    var items = state.role ? NAV[state.role] : [];
    nav.hidden = items.length === 0;
    nav.innerHTML = items.map(function (it) {
      return '<button class="nav-item" data-nav="' + it.id + '"' + (it.id === state.navId ? ' aria-current="page"' : '') + '>' +
        icon(it.icon) + '<span>' + esc(it.label) + '</span>' + (it.soon ? '<i class="soon-dot" title="Segera hadir"></i>' : '') + '</button>';
    }).join('');
    $$('.nav-item', nav).forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.navId === b.dataset.nav) return;
        state.navId = b.dataset.nav;
        renderNav();
        renderMain(true);
      });
    });
  }

  function renderMain(focus) {
    var main = $('#main');
    var item = state.role ? navItem(state.role, state.navId) : null;
    if (!item) { main.innerHTML = noRoleHtml(); }
    else if (item.soon) { main.innerHTML = soonHtml(item); }
    else if (item.id === 'beranda') { renderHome(main); }
    else if (item.id === 'pengguna') { renderUsers(main); }
    if (focus) main.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function noRoleHtml() {
    return '<div class="card empty">' + icon('calendar') + '<h2>Belum ada peran untuk akun ini</h2>' +
      '<p>Akun Anda belum terhubung ke jadwal mengajar, wali kelas, atau jadwal piket. Hubungi admin sekolah agar NIP Anda dimasukkan ke data jadwal.</p>' +
      '<p class="hint">Peran Guru Piket hanya muncul pada hari giliran piket Anda.</p></div>';
  }

  function soonHtml(item) {
    return '<div class="page-head"><div><h1>' + esc(item.label) + '</h1></div></div>' +
      '<div class="card soon"><div class="bubble">' + icon(item.icon) + '</div><h2>Segera hadir</h2><p>' + esc(item.soon.text) + '</p>' +
      '<span class="badge info">' + esc(item.soon.stage) + '</span></div>';
  }

  function openAccount() {
    var u = state.user;
    openDialog({
      title: u.nama,
      sub: '@' + u.username + ' · ' + u.tipe + (u.nip ? ' · NIP/NUPTK ' + u.nip : ''),
      body: '<div class="chips" style="margin:0">' + state.roles.map(function (r) { return '<span class="badge info">' + esc(r.label) + '</span>'; }).join('') + '</div>',
      foot: '<button class="btn secondary" data-close>Tutup</button>' +
        '<button class="btn secondary" id="accPw">' + icon('key', 'sm') + 'Ganti password</button>' +
        '<button class="btn" id="accOut">' + icon('logout', 'sm') + 'Keluar</button>',
      onMount: function () {
        $('#accOut').addEventListener('click', logout);
        $('#accPw').addEventListener('click', function () {
          openDialog({ title: 'Ganti password', sub: 'Setelah diganti, Anda tetap masuk di perangkat ini.', body: passwordFormHtml(false), onMount: function (d) { bindPasswordForm(d); $('#pw0', d).focus(); } });
        });
      }
    });
  }

  /* ============ beranda ============ */
  function renderHome(main) {
    var ids = state.roles.map(function (r) { return r.id; });
    var live = ids.indexOf('guru_piket') >= 0;
    var isAdmin = state.user.tipe === 'Admin';
    main.innerHTML =
      '<section class="hero"><h1>' + greeting() + ', ' + esc(shortName(state.user.nama)) + '</h1>' +
        '<p class="date">' + esc(state.today ? longDate(state.today.date) : '') + '</p>' +
        '<div class="chips">' + state.roles.map(function (r) { return '<span class="chip">' + esc(r.label) + '</span>'; }).join('') +
        (live ? '<span class="chip live">' + icon('check', 'sm') + 'Bertugas piket hari ini</span>' : '') + '</div></section>' +
      (isAdmin ? '<section aria-label="Ringkasan akun"><div class="stats" id="stats">' +
        [1, 2, 3].map(function () { return '<div class="stat"><div class="skel" style="height:30px;width:60%"></div><div class="skel" style="height:14px;width:80%;margin-top:8px"></div></div>'; }).join('') + '</div></section>' : '') +
      '<div class="card"><h2>' + (isAdmin ? 'Mulai dari sini' : 'Tentang aplikasi ini') + '</h2><p class="muted" style="margin-top:6px">' +
        (isAdmin
          ? 'Buat akun guru lewat menu Pengguna, lalu bagikan password sementaranya. Guru akan diminta menggantinya saat masuk pertama kali.'
          : 'Dashboard kehadiran dan kejadian akan tampil di sini setelah modul absensi dan kejadian aktif. Anda dapat mengganti password lewat ikon akun di pojok kanan atas.') +
        '</p></div>';
    if (isAdmin) loadUsers(false).then(paintStats).catch(function (e) {
      if (!e.handled) { var s = $('#stats'); if (s) s.innerHTML = errorHtml(e.message); bindRetry(s, function () { renderHome(main); }); }
    });
  }

  function paintStats() {
    var s = $('#stats');
    if (!s || !state.users) return;
    var list = state.users;
    var active = list.filter(function (u) { return u.aktif; });
    var pending = list.filter(function (u) { return u.aktif && u.belumGanti; });
    s.innerHTML =
      stat(active.length, 'Akun aktif') +
      stat(active.filter(function (u) { return u.tipe === 'Guru'; }).length, 'Guru aktif') +
      stat(pending.length, 'Belum ganti password');
  }
  function stat(n, label) { return '<div class="stat"><strong>' + n + '</strong><span>' + esc(label) + '</span></div>'; }

  function errorHtml(message) {
    return '<div class="card empty">' + icon('alert') + '<p>' + esc(message) + '</p><button class="btn secondary" data-retry>Coba lagi</button></div>';
  }
  function bindRetry(root, fn) {
    var b = root && root.querySelector('[data-retry]');
    if (b) b.addEventListener('click', fn);
  }

  /* ============ pengguna ============ */
  function loadUsers(force) {
    if (state.users && !force) return Promise.resolve(state.users);
    return call('users.list').then(function (d) { state.users = d.users; return state.users; });
  }

  function renderUsers(main) {
    main.innerHTML =
      '<div class="page-head"><div><h1>Pengguna</h1><p id="ucount">&nbsp;</p></div>' +
        '<button class="btn" id="addUser">' + icon('plus', 'sm') + 'Tambah pengguna</button></div>' +
      '<div class="toolbar"><div class="search">' + icon('search', 'sm') +
        '<input class="input" id="q" type="search" placeholder="Cari nama, username, atau NIP" aria-label="Cari pengguna" autocomplete="off"></div>' +
        '<select class="input" id="tf" aria-label="Filter tipe akun"><option value="">Semua tipe</option><option>Guru</option><option>Kepala Sekolah</option><option>Admin</option></select></div>' +
      '<div id="ulist" aria-live="polite"></div>';
    var list = $('#ulist');
    list.innerHTML = [1, 2, 3, 4].map(function () { return '<div class="skel" style="height:78px;margin-bottom:10px"></div>'; }).join('');
    $('#addUser').addEventListener('click', function () { openUserForm(null); });
    $('#q').addEventListener('input', paintUsers);
    $('#tf').addEventListener('change', paintUsers);
    list.addEventListener('click', onUserAction);
    loadUsers(true).then(paintUsers).catch(function (e) {
      if (e.handled) return;
      list.innerHTML = errorHtml(e.message);
      bindRetry(list, function () { renderUsers(main); });
    });
  }

  function badges(u) {
    return (u.aktif ? '<span class="badge ok">Aktif</span>' : '<span class="badge off">Nonaktif</span>') +
      (u.aktif && u.belumGanti ? '<span class="badge warn">Belum ganti password</span>' : '');
  }

  function userRow(u) {
    var self = u.username === state.user.username;
    return '<div class="urow' + (u.aktif ? '' : ' inactive') + '" role="row">' +
      '<div class="who" role="cell"><strong>' + esc(u.nama) + '</strong><span>@' + esc(u.username) + (self ? ' · Anda' : '') + '</span></div>' +
      '<div role="cell"><span class="cell-label">Tipe</span><span class="badge info">' + esc(u.tipe) + '</span></div>' +
      '<div role="cell" class="nip' + (u.nip ? '' : ' none') + '"><span class="cell-label">NIP/NUPTK</span>' + (u.nip ? esc(u.nip) : '—') + '</div>' +
      '<div role="cell"><span class="cell-label">Status</span><div class="meta">' + badges(u) + '</div></div>' +
      '<div role="cell" class="acts">' +
        '<button class="btn secondary small" data-act="edit" data-u="' + esc(u.username) + '" aria-label="Ubah ' + esc(u.nama) + '">' + icon('pen', 'sm') + 'Ubah</button>' +
        (self ? '' : '<button class="btn secondary small" data-act="reset" data-u="' + esc(u.username) + '" aria-label="Reset password ' + esc(u.nama) + '">' + icon('key', 'sm') + 'Reset</button>' +
          '<button class="btn ghost small" data-act="toggle" data-u="' + esc(u.username) + '" aria-label="' + (u.aktif ? 'Nonaktifkan ' : 'Aktifkan ') + esc(u.nama) + '">' + (u.aktif ? 'Nonaktifkan' : 'Aktifkan') + '</button>') +
      '</div></div>';
  }

  function paintUsers() {
    var list = $('#ulist');
    if (!list || !state.users) return;
    var q = ($('#q').value || '').trim().toLowerCase();
    var tf = $('#tf').value;
    var rows = state.users.filter(function (u) {
      if (tf && u.tipe !== tf) return false;
      return !q || (u.nama + ' ' + u.username + ' ' + u.nip).toLowerCase().indexOf(q) >= 0;
    });
    $('#ucount').textContent = state.users.length + ' akun' + (rows.length !== state.users.length ? ' · ' + rows.length + ' cocok' : '');
    if (!rows.length) {
      list.innerHTML = '<div class="card empty">' + icon('search') + '<p>' + (state.users.length ? 'Tidak ada pengguna yang cocok dengan pencarian.' : 'Belum ada pengguna.') + '</p></div>';
      return;
    }
    list.className = 'ulist';
    list.setAttribute('role', 'table');
    list.setAttribute('aria-label', 'Daftar pengguna');
    list.innerHTML = '<div class="uhead" role="row"><div role="columnheader">Nama</div><div role="columnheader">Tipe</div><div role="columnheader">NIP/NUPTK</div><div role="columnheader">Status</div><div role="columnheader">Aksi</div></div>' +
      rows.map(userRow).join('');
  }

  function findUser(username) {
    return (state.users || []).filter(function (u) { return u.username === username; })[0] || null;
  }

  function onUserAction(ev) {
    var btn = ev.target.closest('[data-act]');
    if (!btn) return;
    var u = findUser(btn.dataset.u);
    if (!u) return;
    if (btn.dataset.act === 'edit') openUserForm(u);
    else if (btn.dataset.act === 'reset') confirmReset(u);
    else if (btn.dataset.act === 'toggle') toggleActive(u, btn);
  }

  function userFormHtml(u) {
    var self = !!u && u.username === state.user.username;
    var tipe = u ? u.tipe : 'Guru';
    function opt(v) { return '<option' + (v === tipe ? ' selected' : '') + '>' + v + '</option>'; }
    return '<form class="form" id="uForm" novalidate>' +
      (u ? '<div class="field"><span class="label">Username</span><div class="mono">@' + esc(u.username) + '</div></div>'
         : '<div class="field"><label for="fu">Username</label><input class="input" id="fu" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" maxlength="32" required>' +
           '<span class="hint">3–32 karakter: huruf kecil, angka, titik, garis bawah, atau strip. Tidak dapat diubah nanti.</span></div>') +
      '<div class="field"><label for="fn">Nama lengkap</label><input class="input" id="fn" maxlength="80" autocomplete="off" value="' + esc(u ? u.nama : '') + '" required></div>' +
      '<div class="field"><label for="ft">Tipe akun</label><select class="input" id="ft"' + (self ? ' disabled' : '') + '>' + opt('Guru') + opt('Kepala Sekolah') + opt('Admin') + '</select>' +
        (self ? '<span class="hint">Tipe akun Anda sendiri tidak dapat diubah.</span>' : '') + '</div>' +
      '<div class="field"><label for="fp">NIP/NUPTK</label><input class="input" id="fp" inputmode="numeric" maxlength="40" autocomplete="off" value="' + esc(u ? u.nip : '') + '">' +
        '<span class="hint">Wajib untuk akun Guru. Menghubungkan akun ke jadwal mengajar, wali kelas, dan piket.</span></div>' +
      '<div class="alert error" id="uErr" role="alert" hidden></div></form>';
  }

  function openUserForm(u) {
    var editing = !!u;
    openDialog({
      title: editing ? 'Ubah pengguna' : 'Tambah pengguna',
      sub: editing ? '' : 'Password sementara dibuat otomatis dan ditampilkan sekali setelah akun disimpan.',
      body: userFormHtml(u),
      foot: '<button class="btn secondary" data-close>Batal</button><button class="btn" id="uSave" type="button">' + (editing ? 'Simpan perubahan' : 'Simpan akun') + '</button>',
      onMount: function (d) {
        var form = $('#uForm', d);
        function submit() {
          var box = $('#uErr', d);
          box.hidden = true;
          var data = {
            username: editing ? u.username : $('#fu', d).value.trim().toLowerCase(),
            nama: $('#fn', d).value.replace(/\s+/g, ' ').trim(),
            tipe: $('#ft', d).value,
            nip: $('#fp', d).value.replace(/\s+/g, '')
          };
          var msg = null; var focusId = null;
          if (!editing && !/^[a-z0-9._-]{3,32}$/.test(data.username)) { msg = 'Username 3–32 karakter: huruf kecil, angka, titik, garis bawah, atau strip.'; focusId = 'fu'; }
          else if (data.nama.length < 3) { msg = 'Nama lengkap minimal 3 karakter.'; focusId = 'fn'; }
          else if (data.nip && !/^[0-9]{5,30}$/.test(data.nip)) { msg = 'NIP/NUPTK hanya boleh berisi angka (5–30 digit).'; focusId = 'fp'; }
          else if (data.tipe === 'Guru' && !data.nip) { msg = 'NIP/NUPTK wajib diisi untuk akun Guru.'; focusId = 'fp'; }
          if (msg) { showError(box, msg); $('#' + focusId, d).focus(); return; }
          var btn = $('#uSave', d);
          setBusy(btn, true, 'Menyimpan…');
          var req = editing ? call('users.update', Object.assign({ aktif: u.aktif }, data)) : call('users.create', data);
          req.then(function (res) {
            return loadUsers(true).then(function () {
              closeDialog();
              paintUsers();
              if (editing) toast('Perubahan disimpan.');
              else showCredential('Akun dibuat', res.nama, res.username, res.tempPassword);
            });
          }).catch(function (e) {
            if (e.handled) return;
            setBusy(btn, false);
            showError(box, e.message);
          });
        }
        $('#uSave', d).addEventListener('click', submit);
        form.addEventListener('submit', function (ev) { ev.preventDefault(); submit(); });
        $(editing ? '#fn' : '#fu', d).focus();
      }
    });
  }

  function showCredential(title, nama, username, password) {
    openDialog({
      title: title,
      sub: nama,
      dismissible: false,
      body: '<div class="secret"><span class="muted">Username</span><div class="mono" style="font-size:1.15rem;font-weight:600">' + esc(username) + '</div>' +
        '<span class="muted" style="margin-top:8px">Password sementara</span><div class="value mono" id="tmpPw">' + esc(password) + '</div></div>' +
        '<div class="alert warn">' + icon('alert', 'sm') + '<span>Password ini hanya ditampilkan sekali. Bagikan langsung ke pengguna; mereka wajib menggantinya saat masuk pertama kali.</span></div>',
      foot: '<button class="btn secondary" id="cpy">' + icon('copy', 'sm') + 'Salin untuk dibagikan</button><button class="btn" id="done">Selesai</button>',
      onMount: function (d) {
        $('#cpy', d).addEventListener('click', function () {
          copyText('Username: ' + username + '\nPassword sementara: ' + password).then(function (ok) {
            toast(ok ? 'Tersalin.' : 'Tidak dapat menyalin otomatis. Catat password secara manual.', ok ? undefined : 'error');
          });
        });
        $('#done', d).addEventListener('click', closeDialog);
        $('#done', d).focus();
      }
    });
  }

  function confirmReset(u) {
    openDialog({
      title: 'Reset password?',
      sub: u.nama + ' (@' + u.username + ')',
      body: '<p>Password lama tidak berlaku lagi, perangkat yang sedang masuk dikeluarkan, dan pengguna harus mengganti password sementara saat masuk berikutnya.</p>',
      foot: '<button class="btn secondary" data-close>Batal</button><button class="btn" id="goReset">Reset password</button>',
      onMount: function (d) {
        $('#goReset', d).addEventListener('click', function () {
          var btn = $('#goReset', d);
          setBusy(btn, true, 'Mereset…');
          call('users.resetPassword', { username: u.username }).then(function (res) {
            return loadUsers(true).then(function () {
              closeDialog();
              paintUsers();
              showCredential('Password sementara baru', res.nama, res.username, res.tempPassword);
            });
          }).catch(function (e) {
            if (e.handled) return;
            setBusy(btn, false);
            closeDialog();
            toast(e.message, 'error');
          });
        });
      }
    });
  }

  function toggleActive(u, btn) {
    function run(trigger) {
      setBusy(trigger, true, u.aktif ? 'Menonaktifkan…' : 'Mengaktifkan…');
      call('users.update', { username: u.username, nama: u.nama, tipe: u.tipe, nip: u.nip, aktif: !u.aktif }).then(function () {
        return loadUsers(true);
      }).then(function () {
        closeDialog();
        paintUsers();
        toast(u.aktif ? 'Akun dinonaktifkan.' : 'Akun diaktifkan.');
      }).catch(function (e) {
        if (e.handled) return;
        setBusy(trigger, false);
        closeDialog();
        toast(e.message, 'error');
      });
    }
    if (!u.aktif) { run(btn); return; }
    openDialog({
      title: 'Nonaktifkan akun?',
      sub: u.nama + ' (@' + u.username + ')',
      body: '<p>Pengguna langsung dikeluarkan dan tidak dapat masuk sampai akunnya diaktifkan kembali. Data riwayatnya tetap tersimpan.</p>',
      foot: '<button class="btn secondary" data-close>Batal</button><button class="btn danger" id="goOff">Nonaktifkan</button>',
      onMount: function (d) { $('#goOff', d).addEventListener('click', function () { run($('#goOff', d)); }); }
    });
  }

  /* ============ mulai ============ */
  function renderRetry(message) {
    state.screen = 'retry';
    app.innerHTML = '<div class="splash"><div class="splash-inner" style="padding:24px;text-align:center">' + LOGO +
      '<p style="max-width:34ch">' + esc(message) + '</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn" id="again">Coba lagi</button>' +
      '<button class="btn secondary" id="toLogin" style="color:#fff;border-color:rgba(255,255,255,.4)">Masuk ulang</button></div></div></div>';
    $('#again').addEventListener('click', init);
    $('#toLogin').addEventListener('click', function () { expire(); });
  }

  function init() {
    state.token = storage.get(TOKEN_KEY);
    if (!state.token) { renderLogin(); return; }
    app.innerHTML = '<div class="splash"><div class="splash-inner">' + LOGO + '<span class="spinner" role="status" aria-label="Memuat"></span></div></div>';
    call('session.bootstrap').then(function (d) {
      applyBootstrap(d);
      route();
    }).catch(function (e) {
      if (e.handled) return;
      renderRetry(e.message);
    });
  }

  // Segarkan peran/tanggal bila tab kembali aktif setelah lama (mis. lewat tengah malam atau jadwal berubah).
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || state.screen !== 'shell' || Date.now() - state.bootAt < 600000) return;
    var before = JSON.stringify(state.roles);
    call('session.bootstrap').then(function (d) {
      applyBootstrap(d);
      if (JSON.stringify(state.roles) !== before) { renderTop(); renderNav(); renderMain(false); toast('Peran Anda diperbarui.'); }
    }).catch(function () { /* diam: koneksi akan dicek pada aksi berikutnya */ });
  });

  init();
})();
</script>
